[project]
name = "cadbot"
version = "0.1.0"
description = "cadbot: a home assistant bot whose every decision is made by Claude"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "cadbot/vendor/roboeyes/LICENSE.txt"]
requires-python = ">=3.11"
authors = [{ name = "cadbot contributors" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    # Claude
    "anthropic>=0.80",
    # Camera, faces, frame gate
    "opencv-python>=4.10",
    "numpy>=1.26",
    # Audio in and out
    "sounddevice>=0.5",
    # Speech (Silero VAD runs from the ONNX model bundled with faster-whisper; no PyTorch)
    "faster-whisper>=1.1",
    "onnxruntime>=1.18",
    "piper-tts>=1.3",
    # Face display
    "pygame-ce>=2.5",
    # Scheduling and storage (used from M4)
    "apscheduler>=3.10",
    "sqlalchemy>=2.0",
    # Web UI and health check (later milestones)
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # Google (M5)
    "google-api-python-client>=2.140",
    "google-auth-oauthlib>=1.2",
    # Web logins (later)
    "playwright>=1.47",
    "pyotp>=2.9",
    # Location (later)
    "httpx>=0.27",
    "timezonefinder>=6.5",
    # Hardware helpers
    "pyserial>=3.5",
    "psutil>=6.0",
    "gpiozero>=2.0; sys_platform == 'linux'",
    "keyring>=25.0",
    # Config
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "platformdirs>=4.2",
    "pyyaml>=6.0",
    "truststore>=0.10.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
cadbot = "cadbot.app:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cadbot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["hardware: needs real hardware (run by hand with -m hardware)"]
addopts = "-m 'not hardware'"
filterwarnings = ["ignore:Setting the shape on a NumPy array:DeprecationWarning:sounddevice"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["cadbot/vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# tests poll fakes in small loops on purpose
"tests/**" = ["ASYNC109", "ASYNC110"]
