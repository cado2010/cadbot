# cadbot configuration. Copy to config.yaml (which Git ignores) and edit.
# Every key is optional: anything left out uses the default shown here.
# Secrets never go in this file; the API key lives in .env (see .env.example).

audio:
  input_device: null        # part of the mic's name, e.g. "Headset"; null = system default
  output_device: null       # part of the speaker's name; null = system default
  vad_threshold: 0.5        # Silero speech probability that counts as speech
  end_silence_ms: 700       # a turn ends after this much silence
  min_speech_ms: 250        # shorter blips (coughs, clicks) are ignored
  max_utterance_s: 30
  pre_roll_ms: 300          # audio kept from just before speech started
  half_duplex_tail_ms: 300  # without echo cancellation: mic stays muted this long after speaking
  barge_in_min_s: 0.4       # with echo cancellation: speech this long interrupts cadbot

stt:
  model: small.en           # faster-whisper model; base.en if the Pi is too slow
  device: auto              # auto | cuda | cpu
  compute_type_cpu: int8
  compute_type_cuda: int8_float16
  beam_size: 1
  language: en
  hotwords: cadbot           # helps Whisper hear the name correctly

tts:
  voices:
    en: en_US-lessac-medium

agent:
  model: claude-opus-5-5
  effort: low               # low keeps spoken replies quick; Opus 5.5 always thinks
  max_tokens: 1500          # includes thinking; speak() still limits replies to ~60 words
  max_tool_rounds: 8
  speak_max_words: 60
  web_search_max_uses: 3
  fallbacks: default        # server-side fallback model on refusals; "off" to disable
  request_timeout_s: 60
  one_moment_after_s: 3
  retry_delays_s: [1, 4]
  compact_at_tokens: 60000  # server-side compaction summarises older history past this

vision:
  enabled: true             # false: camera off entirely (no recognition, no eye-following)
  # What goes to Claude (cost control). Face recognition keeps running locally either way.
  #   images:   frames + face readings on scene change, new face or heartbeat (most expensive)
  #   readings: face readings as text only, when someone appears or at the heartbeat
  #   none:     no camera events; what people say still carries who is in view, as text
  send_to_claude: images
  camera_index: 0           # 0 = first webcam
  analyze_hz: 4             # face detection rate while something is happening
  gate_pixel_delta: 25      # frame gate: how much a pixel must change to count
  gate_change_fraction: 0.03  # ...and what share of pixels must change to send a frame
  min_observation_interval_s: 10
  default_watch_interval_s: 300  # heartbeat until Claude chooses its own
  jpeg_quality: 80
  min_face_px: 40           # smaller faces are ignored
  match_confident: 0.50     # SFace cosine similarity for a confident match
  match_maybe: 0.363        # ...and for "not sure" (SFace's suggested threshold)
  max_views_per_person: 8
  pending_forget_after_s: 600   # unsaved people are dropped 10 minutes after leaving view
  track_timeout_s: 2

face:
  camera_preview: true      # small mirrored camera view, lower-left corner (screen only)
  fps: 30
  idle_after_speech_s: 2.5

net:
  health_url: https://api.anthropic.com/
  health_interval_s: 30
  failures_before_offline: 2
  canned_min_interval_s: 60

# Where cadbot is. Set latitude, longitude and city yourself and nothing is sent anywhere;
# otherwise nearby Wi-Fi networks (BSSIDs and signal strength) go to beaconDB, falling back to
# its IP-address estimate, and the coordinates go to OpenStreetMap's Nominatim for the address.
location:
  enabled: true
  latitude: null
  longitude: null
  address: null
  city: null
  region: null
  country_code: null        # two letters, e.g. US
  wifi_lookup: true
  ip_fallback: true
  refresh_hours: 24
  moved_km: 1.0             # moves larger than this are reported to Claude
  contact: ""               # optional contact for the OpenStreetMap User-Agent

# Prices for cadbot's own cost estimates (USD). claude-opus-5-5 list prices as of Nov 2026;
# check https://www.anthropic.com/pricing and update if they change.
pricing:
  input_per_mtok: 4.00
  output_per_mtok: 20.00
  cache_write_per_mtok: 5.00
  cache_read_per_mtok: 0.20
  web_search_per_1k: 10.00

household:
  # Free text added to the system prompt, e.g. greeting habits and quiet hours.
  wishes: ""

# Per-platform overrides, applied on top of everything above.
platforms:
  windows: {}
  pi:
    stt:
      device: cpu
  fake: {}
